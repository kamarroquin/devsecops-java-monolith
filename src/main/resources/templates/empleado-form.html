<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Empleado</title>
</head>
<body>

<h1>Empleado</h1>

<form th:action="@{/empleados}" th:object="${empleado}" method="post">

    <input type="hidden" th:field="*{id}">

    <label>Nombre:</label>
    <input type="text" th:field="*{nombre}">
    <br><br>

    <label>Apellido:</label>
    <input type="text" th:field="*{apellido}">
    <br><br>

    <label>Email:</label>
    <input type="email" th:field="*{email}">
    <br><br>

    <label>Puesto:</label>
    <input type="text" th:field="*{puesto}">
    <br><br>

    <label>Salario:</label>
    <input type="number" step="0.01" th:field="*{salario}">
    <br><br>

    <button type="submit">Guardar</button>

</form>

<br>

<a href="/empleados">Regresar</a>

</body>
</html>
